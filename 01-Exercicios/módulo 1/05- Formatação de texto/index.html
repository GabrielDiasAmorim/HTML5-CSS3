<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formatação de texto</title>
</head>
<body>
    <p>essa notícia é <strong>importante</strong></p>
    <hr>
    <p>essa <em>notícia</em> é importante</p>
    <hr>
    <p>que tal <mark>marca essa frase</mark></p>
    <hr>
    <p>esse texto foi <del>deletado</del></p>
    <hr>
    <p>esse texto foi <ins>inserido</ins></p>
    <hr>
    <p>H <sub>2</sub>O</p>
    <hr>
    <p>2 <sup>3</sup></p>
</body>
</html>
