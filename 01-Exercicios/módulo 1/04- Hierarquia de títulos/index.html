<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hierarquia de títulos</title>
</head>
<body>
    <h1>título principal</h1>
    <h2>título secundário ou sub-titulo</h2>
    <h3>título terciário ou sub-titulo</h3>
    <h4>quarto título</h4>
    <h5>quinto título</h5>
    <h6>sexto título</h6>
    <p>normalmente se usa mais do h1-h3 raramente usado o h4-h6</p>
</body>
</html>
